<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parenting &mdash; Relationship Regulation Atlas</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=zodiak@400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="branch.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <a href="index.html" style="display:flex;gap:.8rem;align-items:center;text-decoration:none;color:inherit">
        <div class="logo" aria-hidden="true"></div>
        <div><h1>Relationship Regulation Atlas</h1></div>
      </a>
    </div>
    <div class="toolbar">
      <button class="btn" data-theme-toggle aria-label="Toggle theme">&#9680;</button>
      <a class="btn" href="index.html">&larr; All contexts</a>
    </div>
  </div>
</div>
<main class="wrap">
  <section class="branch-hero" style="--branch-color:#5a78c9">
    <div class="branch-eyebrow">Caregiving relationships</div>
    <h2 class="branch-title">Parenting</h2>
    <p class="branch-sub">Regulation in the presence of a child&rsquo;s dysregulation. The hardest relational laboratory there is.</p>
  </section>
  <section class="branch-frame" id="branch-content"></section>
  <div class="branch-back-row">
    <a href="index.html" class="btn">&larr; Back to all contexts</a>
    <a href="atlas.html" class="btn primary">Open the full atlas &rarr;</a>
  </div>
</main>
<footer style="border-top:1px solid var(--color-border);margin-top:var(--space-12);padding:var(--space-8) var(--space-4);text-align:center">
  <p class="small muted">Relationship Regulation Atlas &mdash; a work in progress.</p>
</footer>
<script src="data.js"></script>
<script src="resourcing.js"></script>
<script>
(function(){
  const t = document.querySelector('[data-theme-toggle]');
  const r = document.documentElement;
  r.setAttribute('data-theme', 'light');
  t && t.addEventListener('click', () => {
    const next = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', next);
  });
})();
</script>
</body>
</html>
